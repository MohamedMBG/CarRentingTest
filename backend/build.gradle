plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.bbluxurycars'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Tenant persistence (Phase 1, docs/SAAS_ROADMAP.md). Postgres is the
    // system of record for tenancy and billing; Firestore stays the
    // operational store the Android client reads live.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Verifies Firebase ID tokens issued to the Android app and manages
    // custom claims (role, companyId) — see docs/decisions/0001-*.md.
    implementation 'com.google.firebase:firebase-admin:9.4.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Integration tests run against a real Postgres rather than H2: the schema
    // relies on Postgres-specific behaviour (TIMESTAMPTZ, CHECK constraints,
    // and the exclusion constraint that will enforce booking overlap), so a
    // substitute database would pass tests the real one fails.
    // Only the Postgres module: the container is managed by hand as a
    // singleton (see AbstractPostgresIntegrationTest), so neither the
    // JUnit 5 extension nor Boot's @ServiceConnection support is used.
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
